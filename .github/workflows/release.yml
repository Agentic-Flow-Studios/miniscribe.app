name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Signing secrets live in this environment, not at repo level, so a workflow
    # that does not declare it -- ci.yml, or anything a PR adds -- cannot read
    # them at all.
    environment: release

    # A wedged notarization would otherwise run to GitHub's 6h cap, and macOS
    # runners bill at a 10x multiplier on private repos.
    timeout-minutes: 90

    strategy:
      # Keep one OS failing from cancelling the other's upload.
      fail-fast: false
      # Both jobs race to create the draft release, and the loser silently
      # creates a second one that a few artifacts land in. Serialize: Windows
      # finishes in ~3min and creates the draft, then macOS appends to it.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # electron-builder uploads assets in parallel, and two of those uploads
      # each call "create the draft if it is absent" at once. Both win, and a
      # second orphaned draft appears holding whichever artifact lost the race
      # (the .exe blockmap, every time so far). Serializing the matrix did not
      # help -- the race is inside a single electron-builder run, not between
      # jobs. Creating the draft up front leaves nothing to race over. The tag
      # is derived from package.json exactly as electron-builder derives it, so
      # this works for workflow_dispatch as well as for tag pushes.
      - name: Ensure draft release exists
        shell: bash # windows-latest defaults to pwsh
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          # Matched against the releases list rather than `gh release view`:
          # a draft has no real git tag behind it, so tag lookups are not a
          # reliable existence check, and a false negative here would create
          # the very duplicate this step exists to prevent.
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          if [ "$COUNT" -eq 0 ]; then
            echo "Creating draft release $TAG"
            gh release create "$TAG" --draft --title "$TAG" --notes "Draft"
          else
            echo "Draft release $TAG already exists ($COUNT matching)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder does the upload itself so it can generate latest.yml /
      # latest-mac.yml alongside the installers. electron-updater reads those to
      # find new versions -- hand-uploading artifacts to the release breaks
      # auto-update silently.
      #
      # publish.releaseType is "draft" in package.json, so both matrix jobs
      # append to the same draft release. Publish it manually when both are green.
      # Split per-OS on purpose. CSC_LINK is not mac-specific -- electron-builder
      # also reads it for Windows Authenticode -- so a single shared env block
      # would hand the macOS Developer ID cert to the Windows job.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application cert, as a base64-encoded .p12.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization via notarytool. All three are required together --
          # electron-builder throws InvalidConfigurationError if any is missing
          # once APPLE_ID is set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
