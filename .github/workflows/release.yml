name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Keep one OS failing from cancelling the other's upload.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # electron-builder does the upload itself so it can generate latest.yml /
      # latest-mac.yml alongside the installers. electron-updater reads those to
      # find new versions -- hand-uploading artifacts to the release breaks
      # auto-update silently.
      #
      # publish.releaseType is "draft" in package.json, so both matrix jobs
      # append to the same draft release. Publish it manually when both are green.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Developer ID Application cert, as a base64-encoded .p12.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Only hunt the keychain for an identity once a cert is actually
          # supplied; otherwise electron-builder errors instead of skipping.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}

          # Notarization via notarytool. All three are required together --
          # electron-builder throws InvalidConfigurationError if any is missing
          # once APPLE_ID is set. Ignored on the Windows job.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
