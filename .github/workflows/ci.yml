name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stated in-file rather than relying on the repo default, so a change to that
# default cannot silently widen what a PR's workflow run is allowed to do.
permissions:
  contents: read

jobs:
  check:
    # Windows only. macOS runners bill at a 10x multiplier on private repos,
    # and this job is a typecheck/lint/build gate -- nothing in it is
    # platform-specific. The arm64 native-dependency question that justified a
    # macOS leg (sherpa-onnx-node prebuilds) is settled, and the release
    # workflow still builds on macOS for real.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # The suites in test/ are deliberately not run here: they launch Electron
      # against real audio devices and need the ~600MB ONNX models from
      # `npm run get-model`. See README for running them locally.
