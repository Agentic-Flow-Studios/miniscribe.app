name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stated in-file rather than relying on the repo default, so a change to that
# default cannot silently widen what a PR's workflow run is allowed to do.
permissions:
  contents: read

jobs:
  check:
    # Both platforms. The macOS leg is here to catch a broken `npm ci` on
    # arm64 -- sherpa-onnx-node ships prebuilds per platform and the darwin
    # ones have 404'd before (see the pin comment in package.json). Finding
    # that on push is cheap; finding it an hour into a release build, after
    # notarization, is not. Actions minutes are free on public repos.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      # The suites in test/ are deliberately not run here: they launch Electron
      # against real audio devices and need the ~600MB ONNX models from
      # `npm run get-model`. See README for running them locally.
